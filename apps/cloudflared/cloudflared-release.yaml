apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudflare-tunnel-remote
      version: "0.1.2"
      sourceRef:
        kind: HelmRepository
        name: cloudflared-official
        namespace: flux-system