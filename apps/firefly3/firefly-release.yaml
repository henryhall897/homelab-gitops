apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: firefly
  namespace: firefly
spec:
  interval: 1h
  chart:
    spec:
      chart: firefly-iii
      version: "1.10.1"
      sourceRef:
        kind: HelmRepository
        name: firefly-iii
        namespace: flux-system

  # PVC Safety Annotations
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: PersistentVolumeClaim
            patch: |
              - op: add
                path: /metadata/annotations/helm.sh~1resource-policy
                value: keep
              - op: add
                path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1prune
                value: disabled