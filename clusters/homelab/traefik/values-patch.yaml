apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  values:
    nodeSelector:
      node-role.kubernetes.io/ingress: "true"

    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    ports:
      web:
        port: 8000
        expose:
          default: true
        exposedPort: 80
        # If you simply don't want redirects, omit `redirections` entirely.
        # If using redirectTo in v42+:
        # redirectTo:
        #   port: websecure
        forwardedHeaders:
          insecure: true
      websecure:
        port: 8443
        expose:
          default: true
        exposedPort: 443

    # In v42+, logging was restructured. If you only want log level info,
    # the chart uses `logs.general.level` or top-level `log.level` depending on sub-build:
    log:
      level: INFO