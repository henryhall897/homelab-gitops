apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: firefly
  namespace: firefly
spec:
  chart:
    spec:
      chart: firefly-iii
      version: "1.10.1"
      sourceRef:
        kind: HelmRepository
        name: firefly-iii
        namespace: flux-system
  values:
    # 1. Native Node Selector
    nodeSelector:
      node-role.kubernetes.io/heavy-compute: "true"

    # 2. Main Application Config
    config:
      env:
        APP_URL: "https://firefly.henryhalldev.com"
        TZ: "America/New_York"
        TRUSTED_PROXIES: "**"
        DB_CONNECTION: "pgsql"
        DB_HOST: "postgres-shared-rw.database.svc.cluster.local"
        DB_PORT: "5432"
        DB_DATABASE: "firefly"
        DB_USERNAME: "firefly"

      # 3. Native Secret Injections via envValueFrom
      envValueFrom:
        DB_PASSWORD:
          secretKeyRef:
            name: firefly-secrets
            key: db-password
        APP_KEY:
          secretKeyRef:
            name: firefly-secrets
            key: app-key

    # 4. Persistence Settings
    persistence:
      enabled: true
      storageClassName: "local-path"
      storage: 1Gi
