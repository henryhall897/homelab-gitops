apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: firefly
  namespace: firefly

spec:
  values:
    firefly:
      env:
        APP_URL: "https://firefly-v2.henryhalldev.com"
        TZ: "America/New_York"

      ingress:
        enabled: true
        className: "traefik"
        hosts:
          - host: firefly-v2.henryhalldev.com
            paths:
              - path: /
                pathType: ImplementationSpecific

  valuesFrom:
    - kind: Secret
      name: firefly-secrets
      valuesKey: db-password
      targetPath: postgresql.auth.postgresPassword

    - kind: Secret
      name: firefly-secrets
      valuesKey: app-key
      targetPath: firefly.env.APP_KEY

  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: firefly-firefly-db-postgre-db
            patch: |
              - op: add
                path: /spec/template/spec/nodeSelector
                value:
                  node-role.kubernetes.io/heavy-compute: "true"

          - target:
              kind: Deployment
              name: firefly-firefly-iii
            patch: |
              - op: add
                path: /spec/template/spec/nodeSelector
                value:
                  node-role.kubernetes.io/heavy-compute: "true"

          - target:
              kind: Deployment
              name: firefly-importer
            patch: |
              - op: add
                path: /spec/template/spec/nodeSelector
                value:
                  node-role.kubernetes.io/light-compute: "true"

          - target:
              kind: CronJob
              name: firefly-firefly-db-backup
            patch: |
              - op: add
                path: /spec/jobTemplate/spec/template/spec/nodeSelector
                value:
                  node-role.kubernetes.io/light-compute: "true"