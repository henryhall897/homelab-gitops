apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: firefly
  namespace: firefly
spec:
  interval: 1h

  # Remediation blocks so Flux auto-recovers from timeouts
  install:
    remediation:
      retries: 3
  upgrade:
    force: true
    remediation:
      retries: 3

  values:
    firefly:
      env:
        APP_URL: "https://firefly.henryhalldev.com"
        TZ: "America/New_York"

      ingress:
        enabled: true
        className: "traefik"
        hosts:
          - host: firefly.henryhalldev.com
            paths:
              - path: /
                pathType: ImplementationSpecific

    # Corrected: Top-level under values & fixed spelling of 'persistence'
    backup:
      persistence:
        enabled: true
        storageClass: "local-path"
        size: 5Gi

  valuesFrom:
    - kind: Secret
      name: firefly-secrets
      valuesKey: db-password
      targetPath: postgresql.auth.postgresPassword

    - kind: Secret
      name: firefly-secrets
      valuesKey: app-key
      targetPath: firefly.env.APP_KEY
