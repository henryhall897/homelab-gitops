apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: firefly
  namespace: firefly
spec:
  # 1. Inject cluster-specific values
  values:
    firefly:
      env:
        APP_URL: "https://firefly-v2.henryhalldev.com"
        TZ: "America/New_York"
    ingress:
      enabled: true
      className: "traefik"
      hosts:
        - host: firefly-v2.henryhalldev.com
          paths:
            - path: /
              pathType: ImplementationSpecific
              
  # 2. Inject the secret references
  valuesFrom:
    - kind: Secret
      name: firefly-secrets
      valuesKey: db-password
      targetPath: postgresql.auth.postgresPassword
    - kind: Secret
      name: firefly-secrets
      valuesKey: app-key
      targetPath: firefly.env.APP_KEY