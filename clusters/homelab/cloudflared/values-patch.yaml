apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  values:
    replicaCount: 2

    nodeSelector:
      node-role.kubernetes.io/ingress: "true"

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

    image:
      tag: "latest"
      pullPolicy: Always

  valuesFrom:
      - kind: Secret
        name: cloudflared-cloudflare-tunnel-remote
        valuesKey: tunnelToken
        targetPath: tunnelToken