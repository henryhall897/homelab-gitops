apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  values:
    # 1. Replicas under controller
    controllers:
      main:
        replicas: 2

    # 2. Secret reference passed as an environment variable
    env:
      TUNNEL_TOKEN:
        valueFrom:
          secretKeyRef:
            name: cloudflare-tunnel-token
            key: TUNNEL_TOKEN

    # 3. Node selector placed at top-level
    nodeSelector:
      node-role.kubernetes.io/ingress: "true"