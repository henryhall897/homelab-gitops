apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-proxy
  namespace: kube-system
data:
  config.conf: |
    apiVersion: kubeproxy.config.k8s.io/v1alpha1
    kind: KubeProxyConfiguration
    mode: "iptables"
    # Use in-cluster service account credentials (works on all nodes)
    clientConnection:
      kubeconfig: ""
    clusterCIDR: "10.42.0.0/16"
