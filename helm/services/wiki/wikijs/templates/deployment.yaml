apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wikijs.fullname" . }}
  labels:
    {{- include "wikijs.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "wikijs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "wikijs.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wikijs.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP

          # --------------------------------------------------------------------
          # Environment variables (inline + secret-based DB configuration)
          # --------------------------------------------------------------------
          env:
            - name: APP_URL
              value: {{ .Values.env.APP_URL | quote }}
            - name: TRUST_PROXY
              value: {{ .Values.env.TRUST_PROXY | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | quote }}
            - name: HOST
              value: {{ .Values.env.HOST | quote }}
            - name: PORT
              value: {{ .Values.env.PORT | quote }}
            - name: DB_TYPE
              value: {{ .Values.env.DB_TYPE | quote }}

            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.dbSecretName }}
                  key: {{ .Values.env.dbHostKey }}

            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.dbSecretName }}
                  key: {{ .Values.env.dbPortKey }}

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.dbSecretName }}
                  key: {{ .Values.env.dbUserKey }}

            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.dbSecretName }}
                  key: {{ .Values.env.dbPassKey }}

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.dbSecretName }}
                  key: {{ .Values.env.dbNameKey }}

          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
