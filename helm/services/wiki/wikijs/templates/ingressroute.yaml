apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wikijs
  namespace: wiki
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`wiki.henryhalldev.com`)
      kind: Rule
      services:
        - name: wikijs
          port: 80
      middlewares:
        - name: add-forwarded-headers
  tls:
    certResolver: letsencrypt
