apiVersion: v1
kind: Service
metadata:
  name: {{ include "firefly3.fullname" . }}
  labels:
    {{- include "firefly3.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}   # ✅ use numeric port, not "http"
      protocol: TCP
      name: http
  selector:
    {{- include "firefly3.selectorLabels" . | nindent 4 }}
